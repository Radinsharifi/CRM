{% extends 'base.html' %}
{% block content %}
<div class="page-header">
    <h1 class="page-title">افزودن مشتری جدید</h1>
</div>

<div class="card" style="max-width: 600px; margin: 0 auto;">
    <form method="POST">
        {% csrf_token %}
        
        <div class="form-group">
            <label class="form-label">نام شرکت *</label>
            <input type="text" name="company_name" class="form-input" required value="{{ form.company_name.value|default_if_none:'' }}">
            <div class="form-error">{{ form.company_name.errors.0 }}</div>
        </div>

        <div class="form-group">
            <label class="form-label">نام رابط اصلی *</label>
            <input type="text" name="name" class="form-input" required value="{{ form.name.value|default_if_none:'' }}">
            <div class="form-error">{{ form.name.errors.0 }}</div>
        </div>

        <div class="form-group">
            <label class="form-label">شماره تماس *</label>
            <input type="text" name="phone_number" class="form-input" required value="{{ form.phone_number.value|default_if_none:'' }}">
            <div class="form-error">{{ form.phone_number.errors.0 }}</div>
        </div>

        <div class="form-group">
            <label class="form-label">ایمیل</label>
            <input type="email" name="email" class="form-input" value="{{ form.email.value|default_if_none:'' }}">
            <div class="form-error">{{ form.email.errors.0 }}</div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">ذخیره مشتری</button>
            <a href="{% url 'marketing:customer_list' %}" class="btn btn-secondary">انصراف</a>
        </div>
    </form>
</div>
{% endblock %}
